location ^~ /static/ {
    root /app/dist;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include security_headers.conf;
    access_log off;
}

location ^~ /public/website/ {
    root /data;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include security_headers.conf;
    access_log off;
}

location /public {
    root /data;
}

# Problem-import Web API accepts ZIPs up to 256 MiB (contract); allow multipart overhead.
location ^~ /api/admin/problem-import/ {
    include api_proxy.conf;
    client_max_body_size 257m;
}

location /api {
    include api_proxy.conf;
    client_max_body_size 200M;
}

location /admin {
    root /app/dist/admin;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include security_headers.conf;
    try_files \$uri \$uri/ /index.html =404;
}

location /.well-known {
    alias /data/ssl/.well-known;
}

location / {
    root /app/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include security_headers.conf;
    try_files \$uri \$uri/ /index.html =404;
}
