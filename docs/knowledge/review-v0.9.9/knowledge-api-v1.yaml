          }
        }
      },
      "MappingBatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "review_batch_id",
          "problem_id",
          "batch_version",
          "base_version",
          "approved_version",
          "status",
          "mappings",
          "updated_time"
        ],
        "properties": {
          "review_batch_id": {
            "type": "string",
            "format": "uuid"
          },
          "problem_id": {
            "type": "integer",
            "minimum": 1
          },
          "batch_version": {
            "type": "integer",
            "minimum": 1,
            "description": "同题每次提交递增，驳回也占用"
          },
          "base_version": {
            "type": "integer",
            "minimum": 0,
            "description": "只引用提交时当前 approved_version"
          },
          "approved_version": {
            "type": "integer",
            "minimum": 1,
            "nullable": true,
            "description": "仅批准时赋值；pending/rejected 为 null"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "approved",
              "rejected",
              "superseded"
            ]
          },
          "mappings": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "$ref": "#/components/schemas/MappingBatchItem"
            }
          },
          "reason": {
            "type": "string",
            "nullable": true
          },
          "updated_time": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ReviewAction": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expected_updated_time"
        ],
        "properties": {
          "expected_updated_time": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "RejectAction": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expected_updated_time",
          "reason"
        ],
        "properties": {
          "expected_updated_time": {
            "type": "string",
            "format": "date-time"
          },
          "reason": {
            "type": "string",
            "minLength": 2,
            "maxLength": 500
          }
        }
      },
      "PublicKnowledgePoint": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "description", "category", "level", "aliases"],
        "properties": {
          "code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "name": {"type": "string", "minLength": 1, "maxLength": 128},
          "description": {"type": "string"},
          "category": {"$ref": "#/components/schemas/Category"},
          "level": {"type": "integer", "minimum": 1, "maximum": 5},
          "aliases": {"type": "array", "items": {"type": "string"}}
        }
      },
      "DependencyProposal": {
        "type": "object",
        "additionalProperties": false,
        "required": ["prerequisite_code", "dependent_code", "relation_type", "weight"],
        "properties": {
          "prerequisite_code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "dependent_code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "relation_type": {"type": "string", "enum": ["required", "recommended"]},
          "weight": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "maximum": 1, "multipleOf": 0.001}
        }
      },
      "DependencyChangeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["request_id", "operation", "status", "reason", "submitted_by", "created_time", "updated_time"],
        "properties": {
          "request_id": {"type": "string", "format": "uuid"},
          "operation": {"type": "string", "enum": ["create", "update", "delete"]},
          "target_dependency_id": {"type": "integer", "minimum": 1, "nullable": true},
          "base_version": {"type": "integer", "minimum": 1, "nullable": true},
          "before": {"allOf": [{"$ref": "#/components/schemas/Dependency"}], "nullable": true},
          "proposed": {"allOf": [{"$ref": "#/components/schemas/DependencyProposal"}], "nullable": true},
          "status": {"$ref": "#/components/schemas/ReviewStatus"},
          "reason": {"type": "string", "minLength": 2, "maxLength": 500},
          "review_reason": {"type": "string", "nullable": true, "maxLength": 500},
          "submitted_by": {"$ref": "#/components/schemas/UserSummary"},
          "reviewed_by": {"allOf": [{"$ref": "#/components/schemas/UserSummary"}], "nullable": true},
          "created_time": {"type": "string", "format": "date-time"},
          "updated_time": {"type": "string", "format": "date-time"}
        }
      },
      "PublicDependencySummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "relation_type", "weight"],
        "properties": {
          "code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "name": {"type": "string"},
          "relation_type": {"type": "string", "enum": ["required", "recommended"]},
          "weight": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "maximum": 1, "multipleOf": 0.001}
        }
      },
      "PublicProblemSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["display_id", "title"],
        "properties": {
          "display_id": {"type": "string", "minLength": 1, "description": "Problem._id，非数据库主键"},
          "title": {"type": "string"}
        }
      },
      "PublicKnowledgePointDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "description", "category", "level", "aliases", "prerequisites", "dependents", "related_problems"],
        "properties": {
          "code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "name": {"type": "string", "minLength": 1, "maxLength": 128},
          "description": {"type": "string"},
          "category": {"$ref": "#/components/schemas/Category"},
          "level": {"type": "integer", "minimum": 1, "maximum": 5},
          "aliases": {"type": "array", "items": {"type": "string"}},
          "prerequisites": {"type": "array", "items": {"$ref": "#/components/schemas/PublicDependencySummary"}},
          "dependents": {"type": "array", "items": {"$ref": "#/components/schemas/PublicDependencySummary"}},
          "related_problems": {"type": "array", "items": {"$ref": "#/components/schemas/PublicProblemSummary"}, "description": "仅当前 approved 映射关联的 visible 普通题，不回显隐藏题或比赛题计数"}
        }
      },
      "PublicGraphNode": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "level"],
        "properties": {
          "code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "name": {"type": "string"},
          "level": {"type": "integer", "minimum": 1, "maximum": 5}
        }
      },
      "PublicGraphEdge": {
        "type": "object",
        "additionalProperties": false,
        "required": ["from", "to", "relation_type", "weight"],
        "properties": {
          "from": {"$ref": "#/components/schemas/KnowledgeCode"},
          "to": {"$ref": "#/components/schemas/KnowledgeCode"},
          "relation_type": {"type": "string", "enum": ["required", "recommended"]},
          "weight": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "maximum": 1, "multipleOf": 0.001}
        }
      },
      "PublicKnowledgeEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["error", "data", "request_id"],
        "properties": {
          "error": {"type": "string", "nullable": true},
          "data": {"$ref": "#/components/schemas/PublicKnowledgePointDetail"},
          "request_id": {"type": "string"}
        }
      },
      "PublicKnowledgeListEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["error", "data", "request_id"],
        "properties": {
          "error": {"type": "string", "nullable": true},
          "data": {
            "type": "object", "additionalProperties": false,
            "required": ["items", "page", "page_size", "total"],
            "properties": {
              "items": {"type": "array", "items": {"$ref": "#/components/schemas/PublicKnowledgePoint"}},
              "page": {"type": "integer", "minimum": 1},
              "page_size": {"type": "integer", "minimum": 1, "maximum": 100},
              "total": {"type": "integer", "minimum": 0}
            }
          },
          "request_id": {"type": "string"}
        }
      },
      "PublicGraphEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["error", "data", "request_id"],
        "properties": {
          "error": {"type": "string", "nullable": true},
          "data": {
            "type": "object", "additionalProperties": false,
            "required": ["nodes", "edges", "truncated"],
            "properties": {
              "nodes": {"type": "array", "maxItems": 500, "items": {"$ref": "#/components/schemas/PublicGraphNode"}},
              "edges": {"type": "array", "items": {"$ref": "#/components/schemas/PublicGraphEdge"}},
              "truncated": {"type": "boolean"}
            }
          },
          "request_id": {"type": "string"}
        }
      },
      "GraphNode": {
        "type": "object",
        "required": [
          "code",
          "name",
          "level"
        ],
        "properties": {
          "code": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "name": {
            "type": "string"
          },
          "level": {
            "type": "integer"
          }
        }
      },
      "GraphEdge": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "from",
          "to",
          "relation_type",
          "weight"
        ],
        "properties": {
          "id": {
            "type": "integer"
          },
          "from": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "to": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "relation_type": {
            "type": "string"
          },
          "weight": {
            "type": "number"
          }
        }
      },
      "UserSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "username"],
        "properties": {
          "id": {"type": "integer", "minimum": 1},
          "username": {"type": "string", "minLength": 1, "maxLength": 128}
        }
      },
      "ReviewTargetSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["label"],
        "properties": {
          "label": {"type": "string", "minLength": 1, "maxLength": 256},
          "secondary_label": {"type": "string", "nullable": true, "maxLength": 256}
        }
      },
      "ReviewItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "object_type",
          "object_key",
          "object_version",
          "submitter",
          "target_summary",
          "status",
          "created_time",
          "updated_time"
        ],
        "properties": {
          "object_type": {
            "type": "string",
            "enum": [
              "dependency_change",
              "problem_mapping"
            ]
          },
          "object_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "object_version": {
            "type": "integer",
            "minimum": 0
          },
          "operation": {
            "type": "string",
            "enum": ["create", "update", "delete", "replace"],
            "nullable": true
          },
          "submitter": {
            "$ref": "#/components/schemas/UserSummary"
          },
          "target_summary": {
            "$ref": "#/components/schemas/ReviewTargetSummary"
          },
          "status": {
            "$ref": "#/components/schemas/ReviewQueueStatus"
          },
          "updated_time": {
            "type": "string",
            "format": "date-time"
          },
          "created_time": {
            "type": "string",
            "format": "date-time"
          },
          "reason": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "ErrorEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]+$"
          },
          "data": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "message",
              "retryable",
              "details"
            ],
            "properties": {
              "message": {
                "type": "string"
              },
              "retryable": {
                "type": "boolean"
              },
              "details": {
                "type": "object",
                "additionalProperties": true
              }
            }
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "KnowledgeEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "$ref": "#/components/schemas/KnowledgePoint"
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "KnowledgeAdminDetailEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["error", "data", "request_id"],
        "properties": {
          "error": {"type": "string", "nullable": true},
          "data": {"$ref": "#/components/schemas/KnowledgeAdminDetail"},
          "request_id": {"type": "string"}
        }
      },
      "KnowledgeListEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "type": "object",
            "required": [
              "items",
              "page",
              "page_size",
              "total"
            ],
            "properties": {
              "items": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/KnowledgeListItem"
                }
              },
              "page": {
                "type": "integer"
              },
              "page_size": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            }
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "DependencyChangeRequestEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "$ref": "#/components/schemas/DependencyChangeRequest"
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "GraphEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "type": "object",
            "required": [
              "nodes",
              "edges",
              "truncated"
            ],
            "properties": {
              "nodes": {
                "type": "array",
                "maxItems": 500,
                "items": {
                  "$ref": "#/components/schemas/GraphNode"
                }
              },
              "edges": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/GraphEdge"
                }
              },
              "truncated": {
                "type": "boolean"
              }
            }
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "MappingSetEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "problem_id",
              "coverage_status",
              "approved_version",
              "next_batch_version",
              "mappings",
              "pending_batch",
              "capabilities"
            ],
            "properties": {
              "problem_id": {
                "type": "integer",
                "minimum": 1
              },
              "coverage_status": {
                "type": "string",
                "enum": [
                  "unannotated",
                  "in_review",
                  "ready"
                ]
              },
              "approved_version": {
                "type": "integer",
                "minimum": 0
              },
              "next_batch_version": {
                "type": "integer",
                "minimum": 1,
                "description": "该题历史最大 batch_version 加 1"
              },
              "mappings": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/Mapping"
                },
                "description": "仅当前 approved 集合"
              },
              "pending_batch": {
                "allOf": [
                  {
                    "$ref": "#/components/schemas/MappingBatch"
                  }
                ],
                "nullable": true
              },
              "capabilities": {
                "type": "array",
                "uniqueItems": true,
                "items": {
                  "type": "string",
                  "enum": [
                    "view",
                    "submit",
                    "approve",
                    "reject",
                    "replace_approved"
                  ]
                }
              }
            }
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "MappingSubmissionEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "$ref": "#/components/schemas/MappingBatch"
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "DependencyChangeReviewDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["object_type", "request", "capabilities"],
        "properties": {
          "object_type": {"type": "string", "enum": ["dependency_change"]},
          "request": {"$ref": "#/components/schemas/DependencyChangeRequest"},
          "capabilities": {"$ref": "#/components/schemas/ReviewCapabilities"}
        }
      },
      "ProblemReviewSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["problem_id", "display_id", "title"],
        "properties": {
          "problem_id": {"type": "integer", "minimum": 1},
          "display_id": {"type": "string"},
          "title": {"type": "string"}
        }
      },
      "ProblemMappingReviewDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["object_type", "problem", "current_approved_version", "batch", "capabilities"],
        "properties": {
          "object_type": {"type": "string", "enum": ["problem_mapping"]},
          "problem": {"$ref": "#/components/schemas/ProblemReviewSummary"},
          "current_approved_version": {"type": "integer", "minimum": 0},
          "batch": {"$ref": "#/components/schemas/MappingBatch"},
          "capabilities": {"$ref": "#/components/schemas/ReviewCapabilities"}
        }
      },
      "ReviewCapabilities": {
        "type": "array",
        "uniqueItems": true,
        "description": "当前审核用户可执行的动作。提交人查看自己的申请时必须为空；非提交人的 Super Admin 查看 pending 对象时可包含 approve 和 reject。",
        "items": {
          "type": "string",
          "enum": ["approve", "reject"]
        }
      },
      "ReviewDetail": {
        "oneOf": [
          {"$ref": "#/components/schemas/DependencyChangeReviewDetail"},
          {"$ref": "#/components/schemas/ProblemMappingReviewDetail"}
        ],
        "discriminator": {"propertyName": "object_type"}
      },
      "ReviewDetailEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["error", "data", "request_id"],
        "properties": {
          "error": {"type": "string", "nullable": true},
          "data": {"$ref": "#/components/schemas/ReviewDetail"},
          "request_id": {"type": "string"}
        }
      },
      "ReviewEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "$ref": "#/components/schemas/ReviewItem"
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "ReviewListEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error",
          "data",
          "request_id"
        ],
        "properties": {
          "error": {
            "type": "string",
            "nullable": true
          },
          "data": {
            "type": "object",
            "required": [
              "items",
              "page",
              "page_size",
              "total"
            ],
            "properties": {
              "items": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/ReviewItem"
                }
              },
              "page": {
                "type": "integer"
              },
              "page_size": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            }
          },
          "request_id": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "请求字段、类型、枚举或分页参数不合法",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "未登录或登录状态失效",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Forbidden": {
        "description": "无功能权限；审核接口中提交人自审也返回 403 KNOWLEDGE_SELF_REVIEW_FORBIDDEN",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "NotFound": {
        "description": "对象不存在或不在当前用户权限范围",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Conflict": {
        "description": "重复、状态或并发冲突",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Unprocessable": {
        "description": "业务规则校验失败",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "InternalError": {
        "description": "未预期内部错误",
        "headers": {
          "X-API-Version": {
            "$ref": "#/components/headers/ApiVersion"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      }
    }
  }
}
