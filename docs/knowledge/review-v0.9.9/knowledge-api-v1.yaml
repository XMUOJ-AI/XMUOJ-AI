  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sessionid"
      }
    },
    "headers": {
      "ApiVersion": {
        "description": "实际响应契约版本",
        "schema": {
          "type": "string",
          "enum": [
            "0.9.9"
          ]
        }
      }
    },
    "parameters": {
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        }
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "CsrfToken": {
        "name": "X-CSRFToken",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        }
      },
      "KnowledgeCodePath": {
        "name": "knowledge_code",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/KnowledgeCode"
        }
      },
      "DependencyId": {
        "name": "dependency_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      },
      "ProblemId": {
        "name": "problem_id",
        "in": "path",
        "required": true,
        "description": "XMUOJ Problem 数据库主键，不是展示字段 _id",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      },
      "ObjectType": {
        "name": "object_type",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "enum": [
            "dependency_change",
            "problem_mapping"
          ]
        }
      },
      "ObjectKey": {
        "name": "object_key",
        "in": "path",
        "required": true,
        "description": "dependency_change 使用申请 UUID；problem_mapping 使用 review_batch_id UUID",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        }
      }
    },
    "schemas": {
      "KnowledgeCode": {
        "type": "string",
        "pattern": "^[a-z][a-z0-9_]{0,63}$"
      },
      "Category": {
        "type": "string",
        "enum": [
          "basic",
          "data_structure",
          "algorithm",
          "paradigm",
          "mathematics",
          "string",
          "graph"
        ]
      },
      "KnowledgeStatus": {
        "type": "string",
        "enum": [
          "draft",
          "active",
          "deprecated"
        ]
      },
      "ReviewStatus": {
        "type": "string",
        "enum": [
          "pending",
          "approved",
          "rejected"
        ]
      },
      "ReviewQueueStatus": {
        "type": "string",
        "enum": ["pending", "approved", "rejected", "superseded"]
      },
      "KnowledgeCreate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "name",
          "description",
          "category",
          "level"
        ],
        "properties": {
          "code": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "description": {
            "type": "string",
            "maxLength": 5000
          },
          "category": {
            "$ref": "#/components/schemas/Category"
          },
          "level": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "aliases": {
            "type": "array",
            "maxItems": 20,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          "metadata": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "course_chapter": {
                "type": "string",
                "maxLength": 128
              },
              "display_order": {
                "type": "integer",
                "minimum": 0
              }
            }
          }
        }
      },
      "KnowledgeUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "minProperties": 2,
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "description": {
            "type": "string",
            "maxLength": 5000
          },
          "category": {
            "$ref": "#/components/schemas/Category"
          },
          "level": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "status": {
            "$ref": "#/components/schemas/KnowledgeStatus"
          },
          "aliases": {
            "type": "array",
            "maxItems": 20,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          "metadata": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "course_chapter": {
                "type": "string",
                "maxLength": 128
              },
              "display_order": {
                "type": "integer",
                "minimum": 0
              }
            }
          }
        }
      },
      "KnowledgeDelete": {
        "type": "object",
        "additionalProperties": false,
        "required": ["version", "reason"],
        "properties": {
          "version": {"type": "integer", "minimum": 1},
          "reason": {"type": "string", "minLength": 2, "maxLength": 500}
        }
      },
      "KnowledgePoint": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "code",
          "name",
          "normalized_name",
          "description",
          "category",
          "level",
          "status",
          "version",
          "aliases",
          "metadata",
          "created_time",
          "updated_time"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "code": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "name": {
            "type": "string"
          },
          "normalized_name": {
            "type": "string",
            "description": "服务端按 NFKC、空白折叠、ASCII 小写算法生成"
          },
          "description": {
            "type": "string"
          },
          "category": {
            "$ref": "#/components/schemas/Category"
          },
          "level": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "status": {
            "$ref": "#/components/schemas/KnowledgeStatus"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "aliases": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "metadata": {
            "type": "object",
            "additionalProperties": true
          },
          "created_time": {
            "type": "string",
            "format": "date-time"
          },
          "updated_time": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "KnowledgeListItem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "name", "category", "level", "status", "version", "prerequisite_count", "dependent_count", "related_problem_count", "updated_time"],
        "properties": {
          "code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "name": {"type": "string"},
          "category": {"$ref": "#/components/schemas/Category"},
          "level": {"type": "integer", "minimum": 1, "maximum": 5},
          "status": {"$ref": "#/components/schemas/KnowledgeStatus"},
          "version": {"type": "integer", "minimum": 1},
          "prerequisite_count": {"type": "integer", "minimum": 0},
          "dependent_count": {"type": "integer", "minimum": 0},
          "related_problem_count": {"type": "integer", "minimum": 0},
          "updated_time": {"type": "string", "format": "date-time"}
        }
      },
      "AdminDependencySummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["dependency_id", "code", "name", "relation_type", "weight", "version"],
        "properties": {
          "dependency_id": {"type": "integer", "minimum": 1},
          "code": {"$ref": "#/components/schemas/KnowledgeCode"},
          "name": {"type": "string"},
          "relation_type": {"type": "string", "enum": ["required", "recommended"]},
          "weight": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "maximum": 1},
          "version": {"type": "integer", "minimum": 1}
        }
      },
      "AdminProblemSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["problem_id", "display_id", "title", "role", "weight"],
        "properties": {
          "problem_id": {"type": "integer", "minimum": 1},
          "display_id": {"type": "string"},
          "title": {"type": "string"},
          "role": {"type": "string", "enum": ["primary", "secondary", "prerequisite"]},
          "weight": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "maximum": 1}
        }
      },
      "KnowledgeAdminDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["knowledge_point", "capabilities", "prerequisites", "dependents", "related_problems"],
        "properties": {
          "knowledge_point": {"$ref": "#/components/schemas/KnowledgePoint"},
          "capabilities": {"type": "array", "uniqueItems": true, "items": {"type": "string", "enum": ["view", "edit", "change_status", "delete_draft", "request_dependency_change"]}},
          "prerequisites": {"$ref": "#/components/schemas/AdminDependencySummaryList"},
          "dependents": {"$ref": "#/components/schemas/AdminDependencySummaryList"},
          "related_problems": {"$ref": "#/components/schemas/AdminProblemSummaryList"}
        }
      },
      "AdminDependencySummaryList": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "total"],
        "properties": {
          "items": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/AdminDependencySummary"}},
          "total": {"type": "integer", "minimum": 0}
        }
      },
      "AdminProblemSummaryList": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "total"],
        "properties": {
          "items": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/AdminProblemSummary"}},
          "total": {"type": "integer", "minimum": 0}
        }
      },
      "DependencyChangeRequestInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "operation",
          "reason"
        ],
        "properties": {
          "operation": {
            "type": "string",
            "enum": ["create", "update", "delete"]
          },
          "target_dependency_id": {
            "type": "integer",
            "minimum": 1,
            "nullable": true,
            "description": "update/delete 必填；create 不传"
          },
          "base_version": {
            "type": "integer",
            "minimum": 1,
            "nullable": true,
            "description": "update/delete 必填并引用正式边 version；create 不传"
          },
          "prerequisite_code": {
            "allOf": [{"$ref": "#/components/schemas/KnowledgeCode"}],
            "nullable": true,
            "description": "create/update 必填；delete 不传"
          },
          "dependent_code": {
            "allOf": [{"$ref": "#/components/schemas/KnowledgeCode"}],
            "nullable": true,
            "description": "create/update 必填；delete 不传"
          },
          "relation_type": {
            "type": "string",
            "enum": [
              "required",
              "recommended"
            ],
            "nullable": true
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "maximum": 1,
            "multipleOf": 0.001,
            "nullable": true
          },
          "reason": {
            "type": "string",
            "minLength": 2,
            "maxLength": 500
          }
        },
        "description": "operation 字段决定条件必填项：create 需要四个拟提交字段；update 还需要 target_dependency_id 和 base_version；delete 只需要 target_dependency_id、base_version、reason。服务端拒绝不适用于该 operation 的字段。"
      },
      "Dependency": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "prerequisite",
          "dependent",
          "relation_type",
          "weight",
          "source",
          "confidence",
          "version",
          "updated_time"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "prerequisite": {
            "$ref": "#/components/schemas/KnowledgePoint"
          },
          "dependent": {
            "$ref": "#/components/schemas/KnowledgePoint"
          },
          "relation_type": {
            "type": "string",
            "enum": [
              "required",
              "recommended"
            ]
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "maximum": 1
          },
          "source": {
            "type": "string",
            "enum": [
              "manual",
              "import",
              "ai"
            ],
            "description": "冻结模型兼容字段；本期接口只产生 manual，不接受客户端输入，也不触发额外功能"
          },
          "confidence": {
            "type": "number",
            "minimum": 0,
            "maximum": 1,
            "description": "冻结模型兼容字段；本期固定为 1，不展示、不计算且不接受客户端输入"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "updated_time": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "MappingInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "knowledge_code",
          "role",
          "weight"
        ],
        "properties": {
          "knowledge_code": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "role": {
            "type": "string",
            "enum": [
              "primary",
              "secondary",
              "prerequisite"
            ]
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "maximum": 1,
            "multipleOf": 0.001
          }
        }
      },
      "MappingBatchItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "knowledge_code",
          "role",
          "weight",
          "source",
          "confidence"
        ],
        "properties": {
          "knowledge_code": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "role": {
            "type": "string",
            "enum": [
              "primary",
              "secondary",
              "prerequisite"
            ]
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "maximum": 1,
            "multipleOf": 0.001
          },
          "source": {
            "type": "string",
            "enum": [
              "manual",
              "import",
              "ai"
            ],
            "description": "冻结模型兼容字段；本期接口只产生 manual"
          },
          "confidence": {
            "type": "number",
            "minimum": 0,
            "maximum": 1,
            "multipleOf": 0.001,
            "description": "冻结模型兼容字段；本期固定为 1，不参与页面或计算"
          }
        }
      },
      "Mapping": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "knowledge_code",
          "knowledge_name",
          "role",
          "weight",
          "review_status",
          "updated_time"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "knowledge_code": {
            "$ref": "#/components/schemas/KnowledgeCode"
          },
          "knowledge_name": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "primary",
              "secondary",
              "prerequisite"
            ]
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "maximum": 1
          },
          "review_status": {
            "type": "string",
            "enum": [
              "approved"
            ]
          },
          "updated_time": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "MappingSetInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "base_version",
          "mappings"
        ],
        "properties": {
          "base_version": {
            "type": "integer",
            "minimum": 0,
            "description": "提交者读取到的当前 approved_version；未标注题为 0"
          },
