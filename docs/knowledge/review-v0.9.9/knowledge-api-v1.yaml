{
  "openapi": "3.0.3",
  "info": {
    "title": "XMUOJ Knowledge Point API",
    "version": "0.9.9",
    "description": "知识模块专用 API 草案。新接口使用独立响应基类和前端适配器，不改变旧接口全局响应语义；未登录用户不能浏览；依赖变更和题目标注的提交人不得自审。数据模型变更提案合入前不得实现。"
  },
  "servers": [
    {
      "url": "/api",
      "description": "Same-origin XMUOJ backend"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "x-integration-rule": {
    "backend": "知识模块新接口使用 KnowledgeAPIView 生成 error/data/request_id 和 X-API-Version；不得修改全局 APIView 或旧接口包络。",
    "frontend": "知识模块页面使用 knowledgeRequest；适配器处理 4xx、request_id 和无 body 的 204，不得修改全局 ajax。"
  },
  "tags": [
    {
      "name": "Public Knowledge"
    },
    {
      "name": "Knowledge Point"
    },
    {
      "name": "Knowledge Graph"
    },
    {
      "name": "Problem Knowledge"
    },
    {
      "name": "Knowledge Review"
    }
  ],
  "paths": {
    "/knowledge-points": {
      "get": {
        "tags": ["Public Knowledge"],
        "operationId": "listPublicKnowledgePoints",
        "description": "只查询 active 知识点；关键词匹配 code、name、normalized_name 和 aliases，按 code 升序稳定分页。",
        "x-access-rule": {
          "allowed": ["Regular User", "Super Admin", "Admin + ProblemPermission.ALL", "Admin + ProblemPermission.OWN", "Admin + ProblemPermission.NONE"],
          "denied": ["Anonymous"],
          "condition": "Session 必需；服务端仅查询 status=active；不能通过 query 获取草稿或废弃知识点"
        },
        "x-reject-unknown-query-parameters": true,
        "parameters": [
          {"$ref": "#/components/parameters/Page"},
          {"$ref": "#/components/parameters/PageSize"},
          {"name": "keyword", "in": "query", "schema": {"type": "string", "maxLength": 128}},
          {"name": "category", "in": "query", "schema": {"$ref": "#/components/schemas/Category"}},
          {"name": "level", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 5}}
        ],
        "responses": {
          "200": {"description": "已启用知识点分页列表", "headers": {"X-API-Version": {"$ref": "#/components/headers/ApiVersion"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicKnowledgeListEnvelope"}}}},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/knowledge-points/{knowledge_code}": {
      "parameters": [{"$ref": "#/components/parameters/KnowledgeCodePath"}],
      "get": {
        "tags": ["Public Knowledge"],
        "operationId": "getPublicKnowledgePoint",
        "description": "只读详情；prerequisites、dependents 按对方 code 升序，related_problems 按 Problem._id 升序；隐藏题、比赛题及待审数据的编号、标题与计数不返回。",
        "x-access-rule": {
          "allowed": ["Regular User", "Super Admin", "Admin + ProblemPermission.ALL", "Admin + ProblemPermission.OWN", "Admin + ProblemPermission.NONE"],
          "denied": ["Anonymous"],
          "condition": "仅 status=active；非 active 与不存在统一 404；关联题来自当前 approved 映射且 contest_id__isnull=True、visible=True"
        },
        "x-reject-unknown-query-parameters": true,
        "responses": {
          "200": {"description": "已启用知识点只读详情", "headers": {"X-API-Version": {"$ref": "#/components/headers/ApiVersion"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicKnowledgeEnvelope"}}}},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/knowledge-graph": {
      "get": {
        "tags": ["Public Knowledge"],
        "operationId": "getPublicKnowledgeGraph",
        "description": "有 root 时先在 active 正式图中同时沿上游和下游遍历，根距离 0，一条边距离 1；再对非根节点应用 category/level，根始终保留。无 root 时筛选全部 active 节点且忽略 depth。超过 500 个候选时按 distance、code 截断，边按 from、to 排序且不得悬空。/knowledge 局部图只发送 root_code 与 depth；category/level 供 /knowledge/graph 完整图谱筛选使用。",
        "x-access-rule": {
          "allowed": ["Regular User", "Super Admin", "Admin + ProblemPermission.ALL", "Admin + ProblemPermission.OWN", "Admin + ProblemPermission.NONE"],
          "denied": ["Anonymous"],
          "condition": "Session 必需；仅 active 节点和两端 active 的正式边；不支持待审申请或 status"
        },
        "x-reject-unknown-query-parameters": true,
        "parameters": [
          {"name": "root_code", "in": "query", "schema": {"$ref": "#/components/schemas/KnowledgeCode"}},
          {"name": "depth", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 8, "default": 3}},
          {"name": "category", "in": "query", "schema": {"$ref": "#/components/schemas/Category"}},
          {"name": "level", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 5}}
        ],
        "responses": {
          "200": {"description": "当前生效只读图谱", "headers": {"X-API-Version": {"$ref": "#/components/headers/ApiVersion"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicGraphEnvelope"}}}},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/admin/knowledge-points": {
      "get": {
        "tags": [
          "Knowledge Point"
        ],
        "operationId": "listKnowledgePoints",
        "x-access-rule": {
          "allowed": [
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN"
          ],
          "denied": [
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ]
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "keyword",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/Category"
            }
          },
          {
            "name": "level",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 5
            }
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/KnowledgeStatus"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "知识点分页列表",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/KnowledgeListEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      },
      "post": {
        "tags": [
          "Knowledge Point"
        ],
        "operationId": "createKnowledgePoint",
        "x-access-rule": {
          "allowed": [
            "Super Admin"
          ],
          "denied": [
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ]
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/KnowledgeCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "知识点已创建",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/KnowledgeEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/Unprocessable"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/admin/knowledge-points/{knowledge_code}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/KnowledgeCodePath"
        }
      ],
      "get": {
        "tags": [
          "Knowledge Point"
        ],
        "operationId": "getKnowledgePoint",
        "x-access-rule": {
          "allowed": [
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN"
          ],
          "denied": [
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ]
        },
        "responses": {
          "200": {
            "description": "知识点详情",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/KnowledgeAdminDetailEnvelope"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      },
      "patch": {
        "tags": [
          "Knowledge Point"
        ],
        "operationId": "updateKnowledgePoint",
        "description": "仅允许 draft->active 或 active->deprecated。废弃前不能有引用该点的 pending 依赖变更申请、pending 映射批次、当前正式依赖或当前 ProblemKnowledge 映射；有引用或非法跳转时返回 409 且状态/version 不变。",
        "x-access-rule": {
          "allowed": [
            "Super Admin"
          ],
          "denied": [
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ]
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/KnowledgeUpdate"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "知识点已更新",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/KnowledgeEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/Unprocessable"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/admin/knowledge-points/{knowledge_code}/delete": {
      "parameters": [{"$ref": "#/components/parameters/KnowledgeCodePath"}],
      "post": {
        "tags": ["Knowledge Point"],
        "operationId": "deleteUnusedDraftKnowledgePoint",
        "description": "操作命令：仅删除从未被正式依赖、依赖变更申请、题目映射或映射批次引用的 draft。JSON 体携带 version 和 reason；在同一事务复核状态、版本及引用，写受限快照事件后删除。active/deprecated 或任一引用返回 409。",
        "x-access-rule": {
          "allowed": ["Super Admin"],
          "denied": ["Admin + ProblemPermission.ALL", "Admin + ProblemPermission.OWN", "Admin + ProblemPermission.NONE", "Regular User"]
        },
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}],
        "requestBody": {
          "required": true,
          "content": {"application/json": {"schema": {"$ref": "#/components/schemas/KnowledgeDelete"}}}
        },
        "responses": {
          "204": {"description": "未使用草稿已删除，审计事件已提交", "headers": {"X-API-Version": {"$ref": "#/components/headers/ApiVersion"}}},
          "400": {"$ref": "#/components/responses/BadRequest"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "409": {"$ref": "#/components/responses/Conflict"},
          "500": {"$ref": "#/components/responses/InternalError"}
        }
      }
    },
    "/admin/knowledge-graph": {
      "get": {
        "tags": [
          "Knowledge Graph"
        ],
        "operationId": "getKnowledgeGraph",
        "description": "正式图查询。有 root 时先双向遍历再过滤且根始终保留；无 root 时过滤全部 active 节点并忽略 depth；超过 500 按 distance、code 截断，边不得悬空。待审依赖变更只能从审核接口查看。",
        "x-access-rule": {
          "allowed": [
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN"
          ],
          "denied": [
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ],
          "condition": "仅 active 节点和正式依赖；所有有权管理账号看到同一正式图"
        },
        "parameters": [
          {
            "name": "root_code",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/KnowledgeCode"
            }
          },
          {
            "name": "depth",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 8,
              "default": 3
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {"$ref": "#/components/schemas/Category"}
          },
          {
            "name": "level",
            "in": "query",
            "schema": {"type": "integer", "minimum": 1, "maximum": 5}
          }
        ],
        "responses": {
          "200": {
            "description": "知识依赖图",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GraphEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/admin/knowledge-dependency-change-requests": {
      "post": {
        "tags": [
          "Knowledge Graph"
        ],
        "operationId": "createKnowledgeDependencyChangeRequest",
        "description": "提交 create、update 或 delete 申请；成功只创建 pending 申请，正式依赖保持不变。",
        "x-access-rule": {
          "allowed": [
            "Super Admin"
          ],
          "denied": [
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ]
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DependencyChangeRequestInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "依赖变更申请已创建，正式图未改变",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DependencyChangeRequestEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/Unprocessable"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/admin/problems/{problem_id}/knowledge-mappings": {
      "parameters": [
        {
          "$ref": "#/components/parameters/ProblemId"
        }
      ],
      "get": {
        "tags": [
          "Problem Knowledge"
        ],
        "operationId": "getProblemKnowledgeMappings",
        "x-access-rule": {
          "allowed": [
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN"
          ],
          "condition": "Super Admin 和 ALL 可访问全部普通题；OWN 仅可访问 created_by 为当前用户且 contest 为空的题目；越权题目统一返回 404"
        },
        "responses": {
          "200": {
            "description": "题目知识点映射集合",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MappingSetEnvelope"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      },
      "put": {
        "tags": [
          "Problem Knowledge"
        ],
        "operationId": "replaceProblemKnowledgeMappings",
        "x-access-rule": {
          "allowed": [
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN"
          ],
          "condition": "Super Admin 和 ALL 可访问全部普通题；OWN 仅可访问 created_by 为当前用户且 contest 为空的题目；越权题目统一返回 404"
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/CsrfToken"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MappingSetInput"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "映射批次已提交审核，当前已批准集合未改变",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MappingSubmissionEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/Unprocessable"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/admin/knowledge-reviews": {
      "get": {
        "tags": [
          "Knowledge Review"
        ],
        "operationId": "listKnowledgeReviews",
        "description": "只返回摘要，默认按 created_time、object_key 升序。支持 object_type、提交人、状态、更新时间范围和关键词筛选；updated_from 不得晚于 updated_to。",
        "x-reject-unknown-query-parameters": true,
        "x-access-rule": {
          "allowed": [
            "Super Admin"
          ],
          "denied": [
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE",
            "Regular User"
          ]
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "object_type",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "dependency_change",
                "problem_mapping"
              ]
            }
          },
          {
            "name": "submitter_id",
            "in": "query",
            "schema": {"type": "integer", "minimum": 1}
          },
          {
            "name": "status",
            "in": "query",
            "schema": {"$ref": "#/components/schemas/ReviewQueueStatus"}
          },
          {
            "name": "updated_from",
            "in": "query",
            "schema": {"type": "string", "format": "date-time"}
          },
          {
            "name": "updated_to",
            "in": "query",
            "schema": {"type": "string", "format": "date-time"}
          },
          {
            "name": "keyword",
            "in": "query",
            "schema": {"type": "string", "maxLength": 128}
          }
        ],
        "responses": {
          "200": {
