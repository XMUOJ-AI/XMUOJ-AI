    "/knowledge-points": {
      "get": {
        "tags": [
          "Public Knowledge"
        ],
        "operationId": "listPublicKnowledgePoints",
        "description": "只查询 active 知识点；关键词匹配 code、name、normalized_name 和 aliases，按 code 升序稳定分页。",
        "x-access-rule": {
          "allowed": [
            "Regular User",
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE"
          ],
          "denied": [
            "Anonymous"
          ],
          "condition": "Session 必需；服务端仅查询 status=active；不能通过 query 获取草稿或废弃知识点"
        },
        "x-reject-unknown-query-parameters": true,
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          },
          {
            "name": "keyword",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/Category"
            }
          },
          {
            "name": "level",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 5
            }
          }
        ],
        "responses": {
          "200": {
            "description": "已启用知识点分页列表",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublicKnowledgeListEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/knowledge-points/{knowledge_code}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/KnowledgeCodePath"
        }
      ],
      "get": {
        "tags": [
          "Public Knowledge"
        ],
        "operationId": "getPublicKnowledgePoint",
        "description": "只读详情；保留 prerequisites、dependents、related_problems 三个数组的原有类型和小集合完整语义。默认 include_collections=true，各集合最多100项；任一可见集合超过100时返回409 KNOWLEDGE_PAGINATION_REQUIRED，details明确集合名、分页入口和不内嵌集合的详情URL，绝不静默截断。include_collections=false显式跳过全部集合，三个数组均为空，prerequisite_count/dependent_count仍是当前正式active邻接总数；关联题完整total由公开分页接口提供。依赖按对方code、依赖id升序；题目按展示编号、数据库id升序。隐藏题、比赛题及待审数据的编号、标题与计数不返回。",
        "x-access-rule": {
          "allowed": [
            "Regular User",
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE"
          ],
          "denied": [
            "Anonymous"
          ],
          "condition": "仅 status=active；非 active 与不存在统一 404；关联题来自当前 approved 映射且 contest_id__isnull=True、visible=True"
        },
        "x-reject-unknown-query-parameters": true,
        "responses": {
          "200": {
            "description": "已启用知识点只读详情",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublicKnowledgeEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          },
          "409": {
            "$ref": "#/components/responses/PaginationRequired"
          }
        },
        "parameters": [
          {
            "name": "include_collections",
            "in": "query",
            "required": false,
            "description": "精确使用true或false，不接受0/1、大小写变体或重复参数。false只读取详情字段和邻接计数，不内嵌集合。",
            "schema": {
              "type": "boolean",
              "default": true
            }
          }
        ]
      }
    },
    "/knowledge-graph": {
      "get": {
        "tags": [
          "Public Knowledge"
        ],
        "operationId": "getPublicKnowledgeGraph",
        "description": "有 root 时先在 active 正式图中同时沿上游和下游遍历，根距离 0，一条边距离 1；再对非根节点应用 category/level，根始终保留。无 root 时筛选全部 active 节点且忽略 depth。超过 500 个候选时按 distance、code 截断，边按 from、to 排序且不得悬空。/knowledge 局部图只发送 root_code 与 depth；category/level 供 /knowledge/graph 完整图谱筛选使用。",
        "x-access-rule": {
          "allowed": [
            "Regular User",
            "Super Admin",
            "Admin + ProblemPermission.ALL",
            "Admin + ProblemPermission.OWN",
            "Admin + ProblemPermission.NONE"
          ],
          "denied": [
            "Anonymous"
          ],
          "condition": "Session 必需；仅 active 节点和两端 active 的正式边；不支持待审申请或 status"
        },
        "x-reject-unknown-query-parameters": true,
        "parameters": [
          {
            "name": "root_code",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/KnowledgeCode"
            }
          },
          {
            "name": "depth",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 8,
              "default": 3
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/Category"
            }
          },
          {
            "name": "level",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 5
            }
          }
        ],
        "responses": {
          "200": {
            "description": "当前生效只读图谱",
            "headers": {
              "X-API-Version": {
                "$ref": "#/components/headers/ApiVersion"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PublicGraphEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
