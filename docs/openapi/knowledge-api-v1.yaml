{
  "openapi": "3.0.3",
  "info": {
    "title": "XMUOJ Knowledge Point API",
    "version": "0.9.9",
    "description": "2026-10-07 H5修订（x-contract-revision=2026-10-07-H5）。知识模块实施工作契约，版本仍为0.9.9，未冻结、未经四方签字。用户已授权实施，原评审包保持不变；当前变更见 docs/knowledge/implementation-notes-2026-10-07.md。新接口使用独立响应基类与客户端适配器，正式图与审核申请分离，提交人不得自审。"
  },
  "servers": [
    {
      "url": "/api",
      "description": "Same-origin XMUOJ backend"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "x-integration-rule": {
    "backend": "知识模块新接口使用 KnowledgeAPIView 生成 error/data/request_id 和 X-API-Version；不得修改全局 APIView 或旧接口包络。",
    "frontend": "知识模块页面使用 knowledgeRequest；适配器处理 4xx、request_id 和无 body 的 204，不得修改全局 ajax。"
  },
  "tags": [
    {
      "name": "Public Knowledge"
    },
    {
      "name": "Knowledge Point"
    },
    {
      "name": "Knowledge Graph"
    },
